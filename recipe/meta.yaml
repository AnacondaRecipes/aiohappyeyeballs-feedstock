{% set name = "aiohappyeyeballs" %}
{% set version = "2.6.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e202810ee718bd01fc6ef49e8ea53d023d5cb6b581076d7925aa499fa55dbe64

build:
  number: 2
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - poetry-core >=2.0.0
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - aiohappyeyeballs
  requires:
    - pip
    - pytest
    - pytest-asyncio
  commands:
    - pip check
    - pytest -vv tests

about:
  home: https://github.com/aio-libs/aiohappyeyeballs
  dev_url: https://github.com/aio-libs/aiohappyeyeballs
  doc_url: https://aiohappyeyeballs.readthedocs.io
  summary: Happy Eyeballs for asyncio
  description: |
    This library exists to allow connecting with Happy Eyeballs (RFC 8305)
    when you already have a list of addrinfo and not a DNS name.
  license: PSF-2.0
  license_family: Other
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
